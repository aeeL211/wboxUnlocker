name: Build C++

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target aeeL --parallel

      - name: Package
        run: |
          mkdir -p output/lib/arm64-v8a
          cp build/libaeeL.so output/lib/arm64-v8a/libaeeL.so
          test ! -e output/lib/arm64-v8a/libshadowhook_nothing.so

          # The game APK has no libc++_shared.so; the mod must not depend on it.
          if readelf -d output/lib/arm64-v8a/libaeeL.so | grep -q 'libc++_shared'; then
            echo "unexpected libc++_shared.so dependency" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mod_aeeL
          path: output/
