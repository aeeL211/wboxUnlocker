name: Build C++

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & Package
        run: |
          mkdir -p output/lib/arm64-v8a
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang++ \
            -shared -fPIC -O3 -Wl,-s -static-libstdc++ \
            -o output/lib/arm64-v8a/libaeeL.so hook.cpp -llog -ldl

      - uses: actions/upload-artifact@v4
        with:
          name: mod_aeeL
          path: output/
